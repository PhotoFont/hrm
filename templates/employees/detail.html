{% extends "base.html" %}

{% block content %}
<div class="container py-4">
    <a href="/employees" class="btn btn-secondary btn-sm mb-3">← กลับ</a>
    <div class="card shadow-sm p-4">
        <h3>ประวัติพนักงาน: {{ emp.first_name }} {{ emp.last_name }}</h3>
        <p>รหัสพนักงาน: {{ emp.emp_code }}</p>
        <p>วันเริ่มงาน: {{ emp.start_date or '-' }}</p>
        <p>อายุงาน: {{ emp.duration }}</p>
    </div>
</div>
{% endblock %}
